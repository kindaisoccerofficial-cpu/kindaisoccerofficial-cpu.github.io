<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

<script>
const homeNewsURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRJGCUzHCh7a4Zro-9baH9Vq3kXzCRQj5_dVTv3gqN4lwEuI4yP0mgL0iiot5T7J-X-c6-TOB-tzQ_/pub?gid=1984553964&single=true&output=csv";

fetch(homeNewsURL)
  .then(response => {
    if (!response.ok) throw new Error("通信エラー");
    return response.text();
  })
  .then(csv => {
    const results = Papa.parse(csv, {
      skipEmptyLines: true
    });

    const rows = results.data.slice(1)
      .filter(row =>
        row[2] && String(row[6]).trim() === "公開"
      )
      .sort((a, b) =>
        new Date(b[0].replace(/\./g, "/")) -
        new Date(a[0].replace(/\./g, "/"))
      )
      .slice(0, 3);

    const list = document.getElementById("latest-news");
    list.innerHTML = "";

    rows.forEach(row => {
      const card = document.createElement("a");
      card.className = "latest-news-card";
      card.href = "news.html";

      card.innerHTML = `
        <span class="latest-news-date"></span>
        <span class="latest-news-category"></span>
        <h3 class="latest-news-title"></h3>
      `;

      card.querySelector(".latest-news-date").textContent = row[0];
      card.querySelector(".latest-news-category").textContent = row[1];
      card.querySelector(".latest-news-title").textContent = row[2];

      list.appendChild(card);
    });

    if (rows.length === 0) {
      list.textContent = "現在お知らせはありません。";
    }
  })
  .catch(error => {
    document.getElementById("latest-news").textContent =
      "お知らせを読み込めませんでした";
  });
</script>

<script>
const homePhotoURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRJGCUzHCh7a4Zro-9baH9Vq3kXzCRQj5_dVTv3gqN4lwEuI4yP0mgL0iiot5T7J-X-c6-TOB-tzQ_/pub?gid=698804474&single=true&output=csv";

function homePhotoLink(url) {
  const match = url.match(/\/file\/d\/([^/]+)/);

  if (match) {
    return "https://drive.google.com/thumbnail?id="
      + match[1] + "&sz=w1600";
  }

  return url;
}

function startSlideshow(photos) {
  const container = document.getElementById("home-slideshow");

  container.innerHTML = "";

  photos.forEach((url, index) => {
    const slide = document.createElement("div");
    slide.className = "slide";

    if (index === 0) {
      slide.classList.add("active");
    }

    slide.style.backgroundImage = `url("${url}")`;
    container.appendChild(slide);
  });

  const slides = container.querySelectorAll(".slide");
  let current = 0;

  if (slides.length <= 1) return;

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  setInterval(() => {
  const previous = slides[current];

  previous.classList.add("exit");
  previous.classList.remove("active");

  current = (current + 1) % slides.length;

  slides[current].classList.add("active");

  setTimeout(() => {
    previous.classList.remove("exit");
  }, 850);

}, 5000);
}

fetch(homePhotoURL)
  .then(response => {
    if (!response.ok) throw new Error("通信エラー");
    return response.text();
  })
  .then(csv => {
    const results = Papa.parse(csv, {
      skipEmptyLines: true
    });

    const photos = results.data.slice(1)
      .filter(row =>
        row[0] && String(row[2]).trim() === "公開"
      )
      .sort((a, b) => Number(a[1]) - Number(b[1]))
      .map(row => homePhotoLink(row[0].trim()));

    if (!photos.length) throw new Error("写真未登録");

    startSlideshow(photos);
  })
  .catch(error => {
    console.error(error);

    startSlideshow([
      "images/team1.jpg",
      "images/team2.jpg",
      "images/team3.jpg"
    ]);
  });
</script>

<script>
const standingsURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRJGCUzHCh7a4Zro-9baH9Vq3kXzCRQj5_dVTv3gqN4lwEuI4yP0mgL0iiot5T7J-X-c6-TOB-tzQ_/pub?gid=1645391856&single=true&output=csv";

let standingsData = [];

fetch(standingsURL)
  .then(response => {
    if (!response.ok) {
      throw new Error("通信エラー");
    }
    return response.text();
  })
  .then(csv => {
    const results = Papa.parse(csv, {
      skipEmptyLines: true
    });

    standingsData = results.data.slice(1)
      .filter(row => row[0] && row[3])
      .map(row => row.map(value => String(value).trim()));

    const categories = [
      ...new Set(standingsData.map(row => row[0]))
    ];

    const tabs = document.getElementById("standings-tabs");

    tabs.innerHTML = "";

    categories.forEach((category, index) => {
      const button = document.createElement("button");

      button.className = "standings-tab";
      button.textContent = category;

      button.onclick = () => {
        showStandings(category, button);
      };

      tabs.appendChild(button);

      if (index === 0) {
        showStandings(category, button);
      }
    });

    if (categories.length === 0) {
      document.getElementById("standings-error")
        .textContent = "現在、順位表はありません。";
    }
  })
  .catch(error => {
    document.getElementById("standings-error")
      .textContent = "順位表を読み込めませんでした。";
    console.error(error);
  });

function showStandings(category, button) {

  document.querySelectorAll(".standings-tab")
    .forEach(tab => tab.classList.remove("active"));

  button.classList.add("active");

  const rows = standingsData
    .filter(row => row[0] === category)
    .sort((a, b) => Number(a[2]) - Number(b[2]));

  document.getElementById("standings-league")
    .textContent = rows[0] ? rows[0][1] : "";

  const tbody = document.getElementById("standings-body");

  tbody.innerHTML = "";

  rows.forEach(row => {
    const tr = document.createElement("tr");

    if (row[3].includes("近畿大学")) {
      tr.classList.add("kindai-row");
    }

    row.slice(2, 12).forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}
</script>
<script>
function toggleMenu(button) {
  const nav = document.querySelector("header nav");
  const isOpen = nav.classList.toggle("active");

  button.textContent = isOpen ? "×" : "☰";
  button.setAttribute("aria-expanded", isOpen);
}

document.querySelectorAll("header nav a").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelector("header nav").classList.remove("active");

    const button = document.querySelector(".menu-toggle");
    button.textContent = "☰";
    button.setAttribute("aria-expanded", "false");
  });
});
</script>
